{% extends "base.html" %}
{% block content %}
<section class="form-section">
  <h2>🎓 Course Recommender</h2>

  <form id="course-form">
    <!-- Stream Selection -->
    <label for="stream">Stream:</label>
    <select id="stream" name="stream" required>
      <option value="">-- Select --</option>
      <option value="Science">Science</option>
      <option value="Commerce">Commerce</option>
      <option value="Arts">Arts</option>
    </select>

    <!-- Area of Interest (hidden initially) -->
    <div id="interest-container" style="display: none;">
      <label for="interest">Area of Interest:</label>
      <select id="interest" name="interest" required>
        <option value="">-- Select --</option>
        <option value="Tech">Tech</option>
        <option value="Law">Law</option>
        <option value="Management">Management</option>
      </select>
    </div>

    <!-- Other Inputs -->
    <label for="english">Comfortable in English:</label>
    <select id="english" name="english" required>
      <option value="">-- Select --</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <label for="tenth">10th Percentage:</label>
    <input type="number" id="tenth" name="tenth" min="0" max="100" step="0.1" required>

    <label for="twelfth">12th Percentage:</label>
    <input type="number" id="twelfth" name="twelfth" min="0" max="100" step="0.1" required>

    <button type="submit">Recommend</button>
  </form>

  <div id="course-results" class="results"></div>
</section>

<!-- ========== SCRIPT SECTION ========== -->
<script>
  // Show Area of Interest only after Stream is selected
  document.addEventListener("DOMContentLoaded", () => {
    const streamSelect = document.getElementById("stream");
    const interestContainer = document.getElementById("interest-container");

    streamSelect.addEventListener("change", () => {
      if (streamSelect.value.trim() !== "") {
        interestContainer.style.display = "block";
      } else {
        interestContainer.style.display = "none";
      }
    });
  });

  // Course recommendation logic
  document.getElementById("course-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const resDiv = document.getElementById("course-results");
    resDiv.innerHTML = "⏳ Fetching recommendations...";

    try {
      const response = await fetch("/recommend_courses", {
        method: "POST",
        body: formData,
      });

      const data = await response.json();

      if (data.error) {
        resDiv.innerHTML = `<p style="color:red;">⚠️ ${data.error}</p>`;
        return;
      }

      if (!data.eligible) {
        resDiv.innerHTML = `<p style="color:red;">${data.message}</p>`;
        return;
      }

      if (data.recommendations.length > 0) {
        resDiv.innerHTML = `
          <h3>Recommended Courses:</h3>
          <ul>${data.recommendations.map(c => `<li>${c}</li>`).join("")}</ul>
          <a href="${data.apply_link}" target="_blank">
            <button type="submit">Apply Now</button>
          </a>
        `;
      } else {
        resDiv.innerHTML = "ℹ️ No matching courses found.";
      }

    } catch (err) {
      console.error(err);
      resDiv.innerHTML = "⚠️ Error fetching recommendations.";
    }
  });
</script>

<style>
  /* Optional smooth fade-in for interest dropdown */
  #interest-container {
    transition: all 0.3s ease;
  }
</style>

{% endblock %}
