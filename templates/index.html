<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IFHE College Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>🎓 IFHE College Assistant</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="chat">Chatbot</button>
      <button class="tab" data-tab="recommender">Course Recommender</button>
      <button class="tab" data-tab="employees">Employee Lookup</button>
    </nav>
  </header>

  <main>
    <!-- CHAT TAB -->
    <section id="chat" class="tab-content active">
      <div class="chat-container">
        <div id="chat-box" class="chat-box"></div>
        <form id="chat-form" class="chat-form">
          <textarea id="chat-input" placeholder="Type your question..." rows="1"></textarea>
          <button type="submit">Send</button>
        </form>
      </div>
    </section>

    <!-- COURSE RECOMMENDER TAB -->
    <section id="recommender" class="tab-content">
      <div class="form-container">
        <h2>Course Recommender</h2>
        <form id="course-form">
          <label>Stream:</label>
          <select name="stream" required>
            <option value="">Select</option>
            <option>Science</option>
            <option>Commerce</option>
            <option>Arts</option>
          </select>

          <label>Area of Interest:</label>
          <select name="interest" required>
            <option value="">Select</option>
            <option>Tech</option>
            <option>Law</option>
            <option>Management</option>
          </select>

          <label>Comfortable in English?</label>
          <select name="english" required>
            <option value="">Select</option>
            <option>Yes</option>
            <option>No</option>
          </select>

          <label>10th Percentage:</label>
          <input type="number" name="tenth" step="0.1" min="0" max="100" required>

          <label>12th Percentage:</label>
          <input type="number" name="twelfth" step="0.1" min="0" max="100" required>

          <button type="submit">Recommend Courses</button>
        </form>

        <div id="course-results" class="results-box"></div>
      </div>
    </section>

    <!-- EMPLOYEE DETAILS TAB -->
    <section id="employees" class="tab-content">
      <div class="form-container">
        <h2>Employee Details Lookup</h2>
        <form id="employee-form">
          <label>Search by:</label>
          <select name="search_type" required>
            <option value="id">Employee ID</option>
            <option value="salary">Salary ≥</option>
            <option value="experience">Experience ≥</option>
          </select>

          <label>Enter Value:</label>
          <input type="text" name="value" required>

          <button type="submit">Search</button>
        </form>

        <div id="employee-results" class="results-box"></div>
      </div>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
